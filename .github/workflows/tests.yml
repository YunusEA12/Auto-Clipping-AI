name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.10'
          enable-cache: true
      - run: uv sync --locked --group dev

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Production and CI both install uv.lock. Keep the requirements export consistent
      # for environments that still need pip; a browser/version mismatch broke uploads
      # on 2026-11-15. Regenerate with the command in requirements.txt's header.
      - name: requirements.txt matches uv.lock
        if: runner.os == 'Linux'
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt             | grep -v '^#' > /tmp/expected.txt
          grep -v '^#' requirements.txt > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Lint
        if: runner.os == 'Linux'
        run: uv run --locked ruff check .

      - name: Format
        run: uv run --locked ruff format --check src tests scripts app.py conftest.py

      - name: Package boundaries and secret-path guard
        run: uv run --locked python -m scripts.check_repository

      - name: Build distributable wheel
        run: uv build --wheel

      - name: Verify wheel outside repository
        run: uv run --locked python -m scripts.check_wheel

      - run: uv run --locked pytest -q --cov=autoclip --cov-report=term --cov-report=xml:var/reports/coverage.xml
