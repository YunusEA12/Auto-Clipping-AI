# journald drop-in for the Auto-Clipping AI services.
#
# Neither auto-clipping-supervisor.service nor auto-clipping-dashboard.service configures any
# log rotation or rate limiting of its own, and both run 24/7 producing frequent per-cycle log
# lines. Without a cap, journald's persistent log storage (/var/log/journal) can grow unbounded
# and, on a small VPS, eventually compete with output/ for the same disk that
# ProtectSystem=strict already restricts these units to writing under (/opt/auto-clipping-ai).
#
# Install: sudo mkdir -p /etc/systemd/journald.conf.d && \
#          sudo cp deploy/journald-auto-clipping.conf /etc/systemd/journald.conf.d/ && \
#          sudo systemctl restart systemd-journald
#
# This is a global journald setting (systemd has no per-unit disk-usage cap), so the limits
# below apply to the whole journal, not just these two services -- 500M is comfortable
# headroom for a VPS-sized disk while still bounding worst-case growth.
[Journal]
SystemMaxUse=500M
RateLimitIntervalSec=30s
RateLimitBurst=10000
