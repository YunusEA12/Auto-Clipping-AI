[project]
name = "auto-clipping-ai"
version = "0.1.0"
description = "Autonomous 24/7 stream-monitoring and auto-clipping pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "ffmpeg-python",
    "faster-whisper",
    # faster-whisper 1.2.1 passes metadata_errors, removed by PyAV 19.
    # https://github.com/SYSTRAN/faster-whisper/issues/1589
    "av>=11,<19",
    "python-dotenv",
    "pydantic",
    "google-genai",
    "opencv-python-headless",
    "mediapipe",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "streamlit",
    "requests",
    "numpy",
    "streamlink",
    "playwright",
    "browser-cookie3",
    "filelock",
    "psutil",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
# The codebase predates any formatter and uses long, explanatory lines in comments by
# design; 120 keeps those intact instead of inviting a reflow of every file.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Starting deliberately narrow: real defects and unused imports/variables, not style
# opinions. A first lint run that reports hundreds of cosmetic findings gets ignored,
# and then the linter is worthless. Widen once this stays green.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # Long lines: see line-length above — the existing comments are the documentation.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Scripts put the repo root on sys.path before importing project modules, which is an
# import that cannot come first.
"scripts/*.py" = ["E402"]
# app.py muss load_dotenv() vor den Projekt-Importen aufrufen: logging_setup und
# dashboard_api lesen Umgebungsvariablen beim Import, nicht erst beim Aufruf.
"app.py" = ["E402"]
"tests/*.py" = ["E402"]
