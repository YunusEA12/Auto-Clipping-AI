[project]
name = "auto-clipping-ai"
version = "0.2.0"
description = "Autonomous 24/7 stream-monitoring and auto-clipping pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "ffmpeg-python",
    "faster-whisper",
    # faster-whisper 1.2.1 passes metadata_errors, removed by PyAV 19.
    # https://github.com/SYSTRAN/faster-whisper/issues/1589
    "av>=11,<19",
    "python-dotenv",
    "pydantic",
    "google-genai",
    "opencv-python-headless",
    "mediapipe",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "streamlit",
    "requests",
    "numpy",
    "streamlink",
    "playwright",
    "browser-cookie3",
    "filelock",
    "psutil",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
autoclip = "autoclip.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autoclip"]

[tool.hatch.build.targets.sdist]
include = ["src/autoclip", "tests", "README.md", "pyproject.toml", "uv.lock"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.ruff]
# The codebase predates any formatter and uses long, explanatory lines in comments by
# design; 120 keeps those intact instead of inviting a reflow of every file.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Syntax, unused code, common bug patterns and deterministic import order.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = [
    # Long lines: see line-length above — the existing comments are the documentation.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Some administrative scripts initialize their environment before project imports.
"scripts/*.py" = ["E402"]
# Logging reads environment values at import, after the dashboard loads AUTOCLIP_HOME/.env.
"src/autoclip/dashboard/app.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.coverage.run]
branch = true
source = ["autoclip"]
data_file = "var/reports/.coverage"

[tool.coverage.report]
show_missing = true
skip_covered = true
